---
# Handlers for monitoring role

- name: restart prometheus
  systemd:
    name: prometheus
    state: restarted
    daemon_reload: yes
  become: yes

- name: restart grafana
  systemd:
    name: grafana-server
    state: restarted
    daemon_reload: yes
  become: yes

- name: restart elasticsearch
  systemd:
    name: elasticsearch
    state: restarted
    daemon_reload: yes
  become: yes

- name: restart logstash
  systemd:
    name: logstash
    state: restarted
    daemon_reload: yes
  become: yes
  async: 180
  poll: 10
  ignore_errors: yes

- name: restart kibana
  systemd:
    name: kibana
    state: restarted
    daemon_reload: yes
  become: yes

- name: restart elasticsearch_health_exporter
  systemd:
    name: elasticsearch_health_exporter
    state: restarted
    daemon_reload: yes
  become: yes

