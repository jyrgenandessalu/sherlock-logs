---
# Master Ansible playbook for Sherlock-Logs
# Runs all environment provisioning automatically

- hosts: all
  become: yes
  roles:
    - common
    - node_exporter
    - filebeat

- hosts: lb
  become: yes
  roles:
    - nginx_lb
    
- hosts: web
  become: yes
  roles:
    - frontend_container
    - cadvisor

- hosts: app
  become: yes
  roles:
    - backend_container
    - app_deploy
    - cadvisor

- hosts: backup
  become: yes
  roles:
    - jenkins

- hosts: monitoring
  become: yes
  roles:
    - monitoring